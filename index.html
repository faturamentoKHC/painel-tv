<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel TV - Anti-Sleep v3.2</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 20000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
    }

    #start-btn {
      padding: 20px 40px;
      font-size: 24px;
      background: #da291c;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(218, 41, 28, 0.5);
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 2;
    }

    .frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 1;
      transition: opacity 0.8s ease-in-out;
    }

    .frame.ativo {
      opacity: 1;
      z-index: 2;
    }

    .frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Video de fundo forçado a cobrir tudo */
    #keepalive-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      opacity: 0.05;
    }

    #debug-status {
      position: absolute;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff00;
      font-size: 13px;
      z-index: 10000;
      border-radius: 8px;
      pointer-events: none;
      transition: all 0.5s ease;
      white-space: pre;
      border: 1px solid rgba(0,255,0,0.2);
      font-family: monospace;
    }

    .pos-center { bottom: 15px; left: 50%; transform: translateX(-50%); }
    .pos-right { bottom: 15px; right: 15px; transform: none; left: auto; }
  </style>
</head>

<body>

  <div id="splash-screen" onclick="iniciarPainel()">
    <img src="https://www.kraftheinzcompany.com/images/logo_main.png" alt="Logo" style="max-width: 200px; margin-bottom: 30px;">
    <button id="start-btn">CLIQUE AQUI PARA INICIAR O PAINEL</button>
    <p style="margin-top: 20px; font-size: 14px; color: #888;">(V3.2 - Clock & Frame Pulse)</p>
  </div>

  <div id="debug-status" class="pos-center">Aguardando...</div>

  <video id="keepalive-video" muted loop playsinline>
    <source src="VideoTelaPreta.mp4" type="video/mp4">
    <source src="https://faturamentokhc.github.io/painel-tv/VideoTelaPreta.mp4" type="video/mp4">
  </video>

  <div id="container">
    <div class="frame ativo" id="frame1">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/97aef351-f78f-4762-918c-56683f53afad?hidenavbar=true"></iframe>
    </div>

    <div class="frame" id="frame2">
      <iframe src="https://faturamentokhc.github.io/painel-tv/Launcher_App.html"></iframe>
    </div>

    <div class="frame" id="frame3">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/eb6365e3-378a-431e-81c5-c89195d04272?hidenavbar=true"></iframe>
    </div>
  </div>

  <script>
    var statusEl = document.getElementById('debug-status');
    var video = document.getElementById('keepalive-video');
    var splash = document.getElementById('splash-screen');
    var container = document.getElementById('container');
    
    var lastWakeLockStatus = "Aguardando...";
    var lastVideoStatus = "Aguardando...";
    var lastAudioStatus = "Aguardando...";
    var pulseCount = 0;
    var wakeLock = null;

    function updateDisplay() {
      var now = new Date();
      var timeStr = now.getHours().toString().padStart(2, '0') + ":" + 
                    now.getMinutes().toString().padStart(2, '0') + ":" + 
                    now.getSeconds().toString().padStart(2, '0');
      
      statusEl.innerText = "[" + timeStr + "] Pulse: " + pulseCount + "\nWakeLock: " + lastWakeLockStatus + "\nVídeo: " + lastVideoStatus + " | Áudio: " + lastAudioStatus;
    }

    function logStatus(type, msg) {
      if (type === 'wakelock') lastWakeLockStatus = msg;
      if (type === 'video') lastVideoStatus = msg;
      if (type === 'audio') lastAudioStatus = msg;
      updateDisplay();
    }

    function iniciarPainel() {
      splash.style.display = 'none';
      
      // 1. Ativar Video
      video.play().then(function() { logStatus('video', "Rodando ✅"); }).catch(function() { logStatus('video', "Erro ❌"); });
      
      // 2. Ativar Áudio Sintético
      try {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          var audioCtx = new AudioContext();
          var oscillator = audioCtx.createOscillator();
          var gainNode = audioCtx.createGain();
          gainNode.gain.value = 0.001;
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.start();
          logStatus('audio', "Ativo ✅");
        }
      } catch(e) { logStatus('audio', "Erro"); }

      // 3. Ativar WakeLock
      if (navigator.wakeLock) {
        navigator.wakeLock.request('screen').then(function(lock) {
          wakeLock = lock;
          logStatus('wakelock', "Ativo ✅");
        }).catch(function() { logStatus('wakelock', "Erro ⚠️"); });
      }

      // 4. Iniciar Ciclos
      setTimeout(alternar, 5000);
      
      // Loop de atualização do relógio (segundo a segundo)
      setInterval(function() {
        updateDisplay();
      }, 1000);

      // Loop de atividade extra (a cada 20s)
      setInterval(simulateActivity, 20000);
    }

    function simulateActivity() {
      pulseCount++;
      
      // Pulso de opacidade nos frames para evitar suspensão do browser
      container.style.opacity = (container.style.opacity == "0.99") ? "1" : "0.99";
      
      try { history.replaceState(null, null, "#" + pulseCount); } catch(e) {}
    }

    var frames = [
      { id: "frame1", tempo: 60000, pos: "pos-center" },
      { id: "frame2", tempo: 45000, pos: "pos-right" },
      { id: "frame3", tempo: 30000, pos: "pos-center" }
    ];
    var currentFrameIndex = 0;

    function alternar() {
      var atual = document.getElementById(frames[currentFrameIndex].id);
      if (atual) atual.classList.remove("ativo");
      currentFrameIndex = (currentFrameIndex + 1) % frames.length;
      var proximo = document.getElementById(frames[currentFrameIndex].id);
      if (proximo) proximo.classList.add("ativo");
      statusEl.className = frames[currentFrameIndex].pos;
      setTimeout(alternar, frames[currentFrameIndex].tempo);
    }

    window.onload = function() {
      updateDisplay();
    };
  </script>
</body>

</html>
