<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel TV - Anti-Sleep v3.3</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 30000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
    }

    #start-btn {
      padding: 20px 40px;
      font-size: 24px;
      background: #da291c;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 5; /* Abaixo do video de seguranca */
    }

    .frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 1;
      transition: opacity 0.8s ease-in-out;
    }

    .frame.ativo {
      opacity: 1;
      z-index: 2;
    }

    .frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Video de seguranca NO TOPO, quase invisivel */
    #keepalive-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 20000; /* ACIMA DE TUDO */
      opacity: 0.02;
      pointer-events: none; /* Deixa os cliques passarem para os frames */
    }

    /* Ponto de movimento real para enganar sensores de hardware */
    #motion-dot {
      position: fixed;
      width: 4px;
      height: 4px;
      background: #00ff00;
      z-index: 25000;
      border-radius: 50%;
      opacity: 0.5;
      pointer-events: none;
    }

    #debug-status {
      position: absolute;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff00;
      font-size: 11px;
      z-index: 21000; /* Acima do video */
      border-radius: 5px;
      pointer-events: none;
      white-space: pre;
      font-family: monospace;
    }

    .pos-center { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .pos-right { bottom: 10px; right: 10px; transform: none; left: auto; }
  </style>
</head>

<body>

  <div id="splash-screen" onclick="iniciarPainel()">
    <img src="https://www.kraftheinzcompany.com/images/logo_main.png" alt="Logo" style="max-width: 180px; margin-bottom: 20px;">
    <button id="start-btn">INICIAR PAINEL v3.3</button>
  </div>

  <div id="debug-status" class="pos-center">Aguardando...</div>
  <div id="motion-dot"></div>

  <!-- Video de Seguranca (Agora no TOPO) -->
  <video id="keepalive-video" muted loop playsinline>
    <source src="VideoTelaPreta.mp4" type="video/mp4">
    <source src="https://faturamentokhc.github.io/painel-tv/VideoTelaPreta.mp4" type="video/mp4">
  </video>

  <div id="container">
    <div class="frame ativo" id="frame1">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/97aef351-f78f-4762-918c-56683f53afad?hidenavbar=true"></iframe>
    </div>

    <div class="frame" id="frame2">
      <iframe src="https://faturamentokhc.github.io/painel-tv/Launcher_App.html"></iframe>
    </div>

    <div class="frame" id="frame3">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/eb6365e3-378a-431e-81c5-c89195d04272?hidenavbar=true"></iframe>
    </div>
  </div>

  <script>
    var statusEl = document.getElementById('debug-status');
    var video = document.getElementById('keepalive-video');
    var splash = document.getElementById('splash-screen');
    var dot = document.getElementById('motion-dot');
    
    var pulseCount = 0;
    var wakeLock = null;

    function updateDisplay() {
      var now = new Date();
      var timeStr = now.getHours().toString().padStart(2, '0') + ":" + 
                    now.getMinutes().toString().padStart(2, '0') + ":" + 
                    now.getSeconds().toString().padStart(2, '0');
      statusEl.innerText = "[" + timeStr + "] P:" + pulseCount + " | WakeLock: " + (wakeLock ? "OK" : "...");
    }

    function iniciarPainel() {
      splash.style.display = 'none';
      video.play();
      
      if (navigator.wakeLock) {
        navigator.wakeLock.request('screen').then(function(lock) { wakeLock = lock; });
      }

      // Audio Sintetico
      try {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        var audioCtx = new AudioContext();
        var oscillator = audioCtx.createOscillator();
        var gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.001;
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
      } catch(e) {}

      setTimeout(alternar, 5000);
      setInterval(function() { updateDisplay(); moveDot(); }, 1000);
      setInterval(forceActivity, 30000);
    }

    // Move um ponto pelas bordas da tela para gerar atividade de renderizacao real
    function moveDot() {
      var x = Math.random() * (window.innerWidth - 10);
      var y = Math.random() * (window.innerHeight - 10);
      dot.style.left = x + "px";
      dot.style.top = y + "px";
    }

    // Forca o navegador a recalcular a pagina (Anti-suspensao)
    function forceActivity() {
      pulseCount++;
      var body = document.body;
      var currentDisplay = body.style.display;
      body.style.display = 'none';
      body.offsetHeight; // Force reflow
      body.style.display = currentDisplay;
      
      try { history.replaceState(null, null, "#" + pulseCount); } catch(e) {}
    }

    var frames = [
      { id: "frame1", tempo: 60000, pos: "pos-center" },
      { id: "frame2", tempo: 45000, pos: "pos-right" },
      { id: "frame3", tempo: 30000, pos: "pos-center" }
    ];
    var currentFrameIndex = 0;

    function alternar() {
      var atual = document.getElementById(frames[currentFrameIndex].id);
      if (atual) atual.classList.remove("ativo");
      currentFrameIndex = (currentFrameIndex + 1) % frames.length;
      var proximo = document.getElementById(frames[currentFrameIndex].id);
      if (proximo) proximo.classList.add("ativo");
      statusEl.className = frames[currentFrameIndex].pos;
      setTimeout(alternar, frames[currentFrameIndex].tempo);
    }

    window.onload = updateDisplay;
  </script>
</body>
</html>
