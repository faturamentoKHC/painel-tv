<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel TV - Anti-Sleep v2.6</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 2;
    }

    .frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 1;
      transition: opacity 0.8s ease-in-out;
    }

    .frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .frame.ativo {
      opacity: 1;
      z-index: 2;
    }

    /* Video em tela cheia NO FUNDO */
    #keepalive {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.1; /* Levemente visivel no fundo preto */
    }

    /* Canvas para agitar a GPU */
    #gpu-jitter {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      z-index: 10001;
      opacity: 0.01;
      pointer-events: none;
    }

    #debug-status {
      position: absolute;
      padding: 6px 15px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ff00;
      font-size: 12px;
      z-index: 10000;
      border-radius: 8px;
      pointer-events: none;
      transition: all 0.5s ease;
      white-space: pre;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .pos-center { bottom: 15px; left: 50%; transform: translateX(-50%); }
    .pos-right { bottom: 15px; right: 15px; transform: none; left: auto; }
  </style>
</head>

<body>

  <div id="debug-status" class="pos-center">Iniciando...</div>
  <canvas id="gpu-jitter"></canvas>

  <video id="keepalive" muted loop playsinline autoplay>
    <source src="VideoTelaPreta.mp4" type="video/mp4">
    <source src="https://faturamentokhc.github.io/painel-tv/VideoTelaPreta.mp4" type="video/mp4">
  </video>

  <div id="container">
    <div class="frame ativo" id="frame1">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/97aef351-f78f-4762-918c-56683f53afad?hidenavbar=true"></iframe>
    </div>

    <div class="frame" id="frame2">
      <iframe src="https://faturamentokhc.github.io/painel-tv/Launcher_App.html"></iframe>
    </div>

    <div class="frame" id="frame3">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/eb6365e3-378a-431e-81c5-c89195d04272?hidenavbar=true"></iframe>
    </div>
  </div>

  <script>
    var statusEl = document.getElementById('debug-status');
    var canvas = document.getElementById('gpu-jitter');
    var ctx = canvas.getContext('2d');
    var lastWakeLockStatus = "Aguardando...";
    var lastVideoStatus = "Aguardando...";
    var pulseCount = 0;
    var wakeLock = null;

    function updateDisplay() {
      var now = new Date().toLocaleTimeString();
      statusEl.innerText = "[" + now + "] P" + pulseCount + "\nWakeLock: " + lastWakeLockStatus + "\nVídeo: " + lastVideoStatus;
    }

    function logStatus(type, msg) {
      if (type === 'wakelock') lastWakeLockStatus = msg;
      if (type === 'video') lastVideoStatus = msg;
      updateDisplay();
    }

    // --- AGITAÇÃO DE GPU (Canvas) ---
    function jitterGPU() {
      if (ctx) {
        ctx.fillStyle = pulseCount % 2 === 0 ? "#010101" : "#000000";
        ctx.fillRect(0, 0, 1, 1);
      }
      requestAnimationFrame(jitterGPU);
    }
    jitterGPU();

    // --- ALTERNANCIA DE FRAMES ---
    var frames = [
      { id: "frame1", tempo: 60000, pos: "pos-center" },
      { id: "frame2", tempo: 45000, pos: "pos-right" },
      { id: "frame3", tempo: 30000, pos: "pos-center" }
    ];
    var currentFrameIndex = 0;

    function alternar() {
      var atual = document.getElementById(frames[currentFrameIndex].id);
      if (atual) atual.classList.remove("ativo");
      currentFrameIndex = (currentFrameIndex + 1) % frames.length;
      var proximo = document.getElementById(frames[currentFrameIndex].id);
      if (proximo) proximo.classList.add("ativo");
      statusEl.className = frames[currentFrameIndex].pos;
      updateDisplay();
      setTimeout(alternar, frames[currentFrameIndex].tempo);
    }

    // --- LOGICA ANTI-SLEEP ---
    function requestWakeLock() {
      if (!navigator.wakeLock) {
        logStatus('wakelock', "Não suportado ❌");
        return;
      }
      logStatus('wakelock', "Solicitando...");
      navigator.wakeLock.request('screen')
        .then(function(lock) {
          wakeLock = lock;
          logStatus('wakelock', "Ativo ✅");
          wakeLock.onrelease = function() { logStatus('wakelock', "Liberado ⚠️"); wakeLock = null; };
        })
        .catch(function(err) {
          logStatus('wakelock', "Erro/Bloqueado ⚠️");
        });
    }

    function startVideo() {
      var v = document.getElementById("keepalive");
      if (v) {
        v.play()
          .then(function() { logStatus('video', "Rodando ✅"); })
          .catch(function(e) { logStatus('video', "Bloqueado ❌"); });
      }
    }

    window.onload = function() {
      requestWakeLock();
      startVideo();
      setTimeout(alternar, 5000);

      setInterval(function() {
        pulseCount++;
        if (!wakeLock) requestWakeLock();
        
        // Atividade extra: Simular micro-scroll (invisivel mas conta como atividade)
        window.scrollBy(0, 1);
        window.scrollBy(0, -1);
        
        updateDisplay();
      }, 20000);
    };

    document.onclick = function() {
      requestWakeLock();
      startVideo();
    };
  </script>
</body>
</html>
