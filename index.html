<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel TV - Anti-Sleep v3.4</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 30000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
    }

    #start-btn {
      padding: 20px 40px;
      font-size: 24px;
      background: #da291c;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 5;
    }

    .frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 1;
      transition: opacity 0.8s ease-in-out;
    }

    .frame.ativo {
      opacity: 1;
      z-index: 2;
    }

    .frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #keepalive-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      object-fit: cover;
      z-index: 1;
      opacity: 0.01;
      pointer-events: none;
    }

    #motion-dot {
      position: fixed;
      width: 4px;
      height: 4px;
      background: #00ff00;
      z-index: 25000;
      border-radius: 50%;
      opacity: 0.4;
      pointer-events: none;
    }

    #debug-status {
      position: absolute;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff00;
      font-size: 11px;
      z-index: 26000;
      border-radius: 8px;
      pointer-events: none;
      white-space: pre;
      font-family: monospace;
      border: 1px solid rgba(0,255,0,0.2);
    }

    .pos-center { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .pos-right { bottom: 10px; right: 10px; transform: none; left: auto; }
  </style>
</head>

<body>

  <div id="splash-screen" onclick="iniciarPainel()">
    <svg viewBox="0 0 260 90" xmlns="http://www.w3.org/2000/svg" style="width:220px; margin-bottom:20px;">
      <!-- Fundo arredondado -->
      <rect x="0" y="0" width="260" height="90" rx="8" fill="#da291c"/>
      <!-- KRAFT -->
      <text x="130" y="38" font-family="'Segoe UI', Arial Black, sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle" letter-spacing="6">KRAFT</text>
      <!-- Linha divisória -->
      <line x1="20" y1="50" x2="240" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
      <!-- HEINZ -->
      <text x="130" y="76" font-family="'Segoe UI', Arial Black, sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle" letter-spacing="6">HEINZ</text>
    </svg>
    <button id="start-btn">INICIAR PAINEL v3.4</button>
    <p style="margin-top: 15px; color: #888;">(Clique para ativar Proteção Total)</p>
  </div>

  <div id="debug-status" class="pos-center">Aguardando Inicialização...</div>
  <div id="motion-dot"></div>

  <video id="keepalive-video" muted loop playsinline>
    <source src="VideoTelaPreta.mp4" type="video/mp4">
    <source src="https://faturamentokhc.github.io/painel-tv/VideoTelaPreta.mp4" type="video/mp4">
  </video>

  <div id="container">
    <div class="frame ativo" id="frame1">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/97aef351-f78f-4762-918c-56683f53afad?hidenavbar=true"></iframe>
    </div>

    <div class="frame" id="frame2">
      <iframe src="https://faturamentokhc.github.io/painel-tv/Launcher_App.html"></iframe>
    </div>

    <div class="frame" id="frame3">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/eb6365e3-378a-431e-81c5-c89195d04272?hidenavbar=true"></iframe>
    </div>
  </div>

  <script>
    var statusEl = document.getElementById('debug-status');
    var video = document.getElementById('keepalive-video');
    var splash = document.getElementById('splash-screen');
    var dot = document.getElementById('motion-dot');
    
    var lastWakeLockStatus = "Aguardando...";
    var lastVideoStatus = "Aguardando...";
    var lastAudioStatus = "Aguardando...";
    var pulseCount = 0;
    var wakeLock = null;

    function updateDisplay() {
      var now = new Date();
      var timeStr = now.getHours().toString().padStart(2, '0') + ":" + 
                    now.getMinutes().toString().padStart(2, '0') + ":" + 
                    now.getSeconds().toString().padStart(2, '0');
      
      statusEl.innerText = "[" + timeStr + "] Pulse:" + pulseCount + "\nWakeLock:" + lastWakeLockStatus + "\nVídeo:" + lastVideoStatus + " | Áudio:" + lastAudioStatus;
    }

    function logStatus(type, msg) {
      if (type === 'wakelock') lastWakeLockStatus = msg;
      if (type === 'video') lastVideoStatus = msg;
      if (type === 'audio') lastAudioStatus = msg;
      updateDisplay();
    }

    function iniciarPainel() {
      splash.style.display = 'none';
      
      // 1. Video
      video.play()
        .then(function() { logStatus('video', "Rodando ✅"); })
        .catch(function() { logStatus('video', "Erro ❌"); });
      
      // 2. Audio Sintetico
      try {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          var audioCtx = new AudioContext();
          var oscillator = audioCtx.createOscillator();
          var gainNode = audioCtx.createGain();
          gainNode.gain.value = 0.001;
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.start();
          logStatus('audio', "Ativo ✅");
        }
      } catch(e) { logStatus('audio', "Erro"); }

      // 3. WakeLock
      if (navigator.wakeLock) {
        navigator.wakeLock.request('screen').then(function(lock) {
          wakeLock = lock;
          logStatus('wakelock', "Ativo ✅");
        }).catch(function() { logStatus('wakelock', "Erro ⚠️"); });
      } else {
        logStatus('wakelock', "Não sup. ❌");
      }

      setTimeout(alternar, 5000);
      setInterval(function() { updateDisplay(); moveDot(); }, 1000);
      setInterval(forceActivity, 30000);
    }

    function moveDot() {
      var x = Math.random() * (window.innerWidth - 10);
      var y = Math.random() * (window.innerHeight - 10);
      dot.style.left = x + "px";
      dot.style.top = y + "px";
    }

    function forceActivity() {
      pulseCount++;
      // Força reflow seguro sem esconder a tela
      dot.style.opacity = dot.style.opacity === '0.4' ? '0.39' : '0.4';
      dot.getBoundingClientRect();
      // Reacquire WakeLock se perdido
      if (navigator.wakeLock && (!wakeLock || wakeLock.released)) {
        navigator.wakeLock.request('screen').then(function(lock) {
          wakeLock = lock;
          logStatus('wakelock', "Reativado ✅");
        }).catch(function() { logStatus('wakelock', "Erro ⚠️"); });
      }
      updateDisplay();
    }

    var frames = [
      { id: "frame1", tempo: 60000, pos: "pos-center" },
      { id: "frame2", tempo: 45000, pos: "pos-right" },
      { id: "frame3", tempo: 30000, pos: "pos-center" }
    ];
    var currentFrameIndex = 0;

    function alternar() {
      var atual = document.getElementById(frames[currentFrameIndex].id);
      if (atual) atual.classList.remove("ativo");
      currentFrameIndex = (currentFrameIndex + 1) % frames.length;
      var proximo = document.getElementById(frames[currentFrameIndex].id);
      if (proximo) proximo.classList.add("ativo");
      statusEl.className = frames[currentFrameIndex].pos;
      setTimeout(alternar, frames[currentFrameIndex].tempo);
    }

    window.onload = function() {
      updateDisplay();
    };

    // Re-acquire WakeLock quando a página volta ao foco (ex: após screensaver da TV)
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible' && navigator.wakeLock && (!wakeLock || wakeLock.released)) {
        navigator.wakeLock.request('screen').then(function(lock) {
          wakeLock = lock;
          logStatus('wakelock', "Reativado ✅");
        }).catch(function() { logStatus('wakelock', "Erro ⚠️"); });
      }
    });
  </script>
</body>
</html>
