<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel TV - Anti-Sleep v2.7</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 2;
    }

    .frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 1;
      transition: opacity 0.8s ease-in-out;
    }

    .frame.ativo {
      opacity: 1;
      z-index: 2;
    }

    .frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Video de fundo em tela cheia */
    #keepalive-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.05;
    }

    #debug-status {
      position: absolute;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff00;
      font-size: 12px;
      z-index: 10000;
      border-radius: 8px;
      pointer-events: none;
      transition: all 0.5s ease;
      white-space: pre;
      border: 1px solid rgba(0,255,0,0.2);
    }

    .pos-center { bottom: 15px; left: 50%; transform: translateX(-50%); }
    .pos-right { bottom: 15px; right: 15px; transform: none; left: auto; }
  </style>
</head>

<body>

  <div id="debug-status" class="pos-center">Aguardando Interação... (Clique na tela)</div>

  <!-- Video para atividade de midia -->
  <video id="keepalive-video" muted loop playsinline autoplay>
    <source src="VideoTelaPreta.mp4" type="video/mp4">
    <source src="https://faturamentokhc.github.io/painel-tv/VideoTelaPreta.mp4" type="video/mp4">
  </video>

  <!-- Audio silencioso para atividade sonora -->
  <audio id="keepalive-audio" loop>
    <source src="data:audio/wav;base64,UklGRigAAABXQVZFRm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==" type="audio/wav">
  </audio>

  <div id="container">
    <div class="frame ativo" id="frame1">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/97aef351-f78f-4762-918c-56683f53afad?hidenavbar=true"></iframe>
    </div>

    <div class="frame" id="frame2">
      <iframe src="https://faturamentokhc.github.io/painel-tv/Launcher_App.html"></iframe>
    </div>

    <div class="frame" id="frame3">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/eb6365e3-378a-431e-81c5-c89195d04272?hidenavbar=true"></iframe>
    </div>
  </div>

  <script>
    var statusEl = document.getElementById('debug-status');
    var video = document.getElementById('keepalive-video');
    var audio = document.getElementById('keepalive-audio');
    
    var lastWakeLockStatus = "Aguardando Clique...";
    var lastVideoStatus = "Aguardando Clique...";
    var lastAudioStatus = "Aguardando Clique...";
    var pulseCount = 0;
    var wakeLock = null;

    function updateDisplay() {
      var now = new Date().toLocaleTimeString();
      statusEl.innerText = "[" + now + "] P" + pulseCount + "\nWakeLock: " + lastWakeLockStatus + "\nVídeo: " + lastVideoStatus + " | Áudio: " + lastAudioStatus;
    }

    function logStatus(type, msg) {
      if (type === 'wakelock') lastWakeLockStatus = msg;
      if (type === 'video') lastVideoStatus = msg;
      if (type === 'audio') lastAudioStatus = msg;
      updateDisplay();
    }

    // --- LOGICA DE ALTERNANCIA DE FRAMES ---
    var frames = [
      { id: "frame1", tempo: 60000, pos: "pos-center" },
      { id: "frame2", tempo: 45000, pos: "pos-right" },
      { id: "frame3", tempo: 30000, pos: "pos-center" }
    ];
    var currentFrameIndex = 0;

    function alternar() {
      var atual = document.getElementById(frames[currentFrameIndex].id);
      if (atual) atual.classList.remove("ativo");
      currentFrameIndex = (currentFrameIndex + 1) % frames.length;
      var proximo = document.getElementById(frames[currentFrameIndex].id);
      if (proximo) proximo.classList.add("ativo");
      statusEl.className = frames[currentFrameIndex].pos;
      updateDisplay();
      setTimeout(alternar, frames[currentFrameIndex].tempo);
    }

    // --- LOGICA ANTI-SLEEP ---
    function requestWakeLock() {
      if (!navigator.wakeLock) {
        logStatus('wakelock', "Não suportado ❌");
        return;
      }
      logStatus('wakelock', "Solicitando...");
      navigator.wakeLock.request('screen')
        .then(function(lock) {
          wakeLock = lock;
          logStatus('wakelock', "Ativo ✅");
          wakeLock.onrelease = function() { logStatus('wakelock', "Liberado ⚠️"); wakeLock = null; };
        })
        .catch(function(err) {
          logStatus('wakelock', "Erro/Bloqueado ⚠️");
        });
    }

    function activateMedia() {
      // Ativar Video
      video.play()
        .then(function() { logStatus('video', "Rodando ✅"); })
        .catch(function() { logStatus('video', "Erro ❌"); });
      
      // Ativar Audio (Silencioso)
      audio.play()
        .then(function() { logStatus('audio', "Ativo ✅"); })
        .catch(function() { logStatus('audio', "Erro ❌"); });
    }

    function simulateActivity() {
      pulseCount++;
      
      // 1. Simular Eventos
      try {
        window.dispatchEvent(new MouseEvent('mousemove'));
        window.dispatchEvent(new KeyboardEvent('keydown', {key: 'Control'}));
      } catch(e) {}
      
      // 2. Agitar Background (Invisivel)
      document.body.style.backgroundColor = (pulseCount % 2 === 0) ? "#010101" : "#000000";
      
      // 3. Jitter de Hash
      try { history.replaceState(null, null, "#" + pulseCount); } catch(e) {}

      updateDisplay();
    }

    window.onload = function() {
      setTimeout(alternar, 5000);
      setInterval(simulateActivity, 20000);
      updateDisplay();
    };

    // O GATILHO PRINCIPAL: Clique do usuario
    document.onclick = function() {
      logStatus('wakelock', "Iniciando...");
      requestWakeLock();
      activateMedia();
    };
  </script>
</body>

</html>
