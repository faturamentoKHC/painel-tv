<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel TV - Anti-Sleep v2.2</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 1;
      transition: opacity 0.8s ease-in-out;
    }

    .frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .frame.ativo {
      opacity: 1;
      z-index: 2;
    }

    /* Video quase invisivel mas tecnicamente visivel para o navegador */
    #keepalive {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      z-index: 9999;
      pointer-events: none;
    }

    /* Estilos base do Indicador de Status */
    #debug-status {
      position: absolute;
      padding: 6px 15px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ff00; /* Verde neon para visibilidade */
      font-size: 12px;
      z-index: 10000;
      border-radius: 8px;
      pointer-events: none;
      transition: all 0.5s ease;
      white-space: pre; /* Permitir quebras de linha se necessário */
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Posicao: Centro Inferior (Frames 1 e 3) */
    .pos-center {
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Posicao: Canto Inferior Direito (Frame 2) */
    .pos-right {
      bottom: 15px;
      right: 15px;
      transform: none;
      left: auto;
    }
  </style>
</head>

<body>

  <div id="debug-status" class="pos-center">Iniciando Sistema...</div>

  <div id="container">
    <!-- Video oculto para forçar atividade de mídia -->
    <video id="keepalive" muted loop playsinline>
      <source src="VideoTelaPreta.mp4" type="video/mp4">
      <source src="https://faturamentokhc.github.io/painel-tv/VideoTelaPreta.mp4" type="video/mp4">
    </video>

    <div class="frame ativo" id="frame1">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/97aef351-f78f-4762-918c-56683f53afad?hidenavbar=true"></iframe>
    </div>

    <div class="frame" id="frame2">
      <iframe src="https://faturamentokhc.github.io/painel-tv/Launcher_App.html"></iframe>
    </div>

    <div class="frame" id="frame3">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/eb6365e3-378a-431e-81c5-c89195d04272?hidenavbar=true"></iframe>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('debug-status');
    let lastWakeLockStatus = "Aguardando...";
    let lastVideoStatus = "Aguardando...";
    let pulseCount = 0;

    function updateDisplay() {
      const now = new Date().toLocaleTimeString();
      statusEl.innerText = `[${now}] P${pulseCount}\nWakeLock: ${lastWakeLockStatus}\nVídeo: ${lastVideoStatus}`;
    }

    function logStatus(type, msg) {
      if (type === 'wakelock') lastWakeLockStatus = msg;
      if (type === 'video') lastVideoStatus = msg;
      updateDisplay();
      console.log(`${type}: ${msg}`);
    }

    // --- LOGICA DE ALTERNANCIA DE FRAMES ---
    const frames = [
      { id: "frame1", tempo: 60000, pos: "pos-center" },
      { id: "frame2", tempo: 45000, pos: "pos-right" },
      { id: "frame3", tempo: 30000, pos: "pos-center" }
    ];
    let currentFrameIndex = 0;

    function alternar() {
      const atual = document.getElementById(frames[currentFrameIndex].id);
      if (atual) atual.classList.remove("ativo");

      currentFrameIndex = (currentFrameIndex + 1) % frames.length;

      const proximo = document.getElementById(frames[currentFrameIndex].id);
      if (proximo) proximo.classList.add("ativo");

      // Atualizar posicao do status
      statusEl.className = frames[currentFrameIndex].pos;
      
      updateDisplay();
      setTimeout(alternar, frames[currentFrameIndex].tempo);
    }

    // --- LOGICA ANTI-SLEEP ---
    let wakeLock = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) {
        logStatus('wakelock', "Não suportado ❌");
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        logStatus('wakelock', "Ativo ✅");

        wakeLock.addEventListener('release', () => {
          logStatus('wakelock', "Liberado ⚠️");
          setTimeout(requestWakeLock, 1000); // Tentar reativar
        });
      } catch (err) {
        logStatus('wakelock', `Erro: ${err.message}`);
      }
    }

    function startVideo() {
      const v = document.getElementById("keepalive");
      if (v) {
        v.play()
          .then(() => logStatus('video', "Rodando ✅"))
          .catch(e => logStatus('video', "Bloqueado (Clique p/ Ativar) ❌"));
      }
    }

    // Eventos Globais
    window.addEventListener("load", () => {
      requestWakeLock();
      startVideo();
      
      // Timer inicial para frames
      setTimeout(alternar, 5000);

      // Pulso de atividade a cada 15 segundos
      setInterval(() => {
        pulseCount++;
        if (wakeLock === null) requestWakeLock();
        
        // Pequena "agitação" no DOM para TVs que monitoram inatividade de renderização
        statusEl.style.opacity = (statusEl.style.opacity == "0.99") ? "1" : "0.99";
        
        updateDisplay();
      }, 15000);
    });

    document.addEventListener("click", () => {
      logStatus('video', "Interação detectada!");
      requestWakeLock();
      startVideo();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        requestWakeLock();
        startVideo();
      }
    });

  </script>
</body>

</html>
