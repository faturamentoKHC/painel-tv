<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel TV - Anti-Sleep v3.4</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 30000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
    }

    #start-btn {
      padding: 20px 40px;
      font-size: 24px;
      background: #da291c;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 5;
    }

    .frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 1;
    }

    .frame.ativo {
      opacity: 1;
      z-index: 2;
    }

    .frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #keepalive-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      object-fit: cover;
      z-index: 1;
      opacity: 0.01;
      pointer-events: none;
    }

    #motion-dot {
      position: fixed;
      width: 4px;
      height: 4px;
      background: #00ff00;
      z-index: 25000;
      border-radius: 50%;
      opacity: 0.4;
      pointer-events: none;
    }

    #debug-status {
      position: absolute;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.25);
      color: #00ff00;
      font-size: 10px;
      z-index: 26000;
      border-radius: 6px;
      pointer-events: none;
      white-space: pre;
      font-family: monospace;
      border: 1px solid rgba(0, 255, 0, 0.1);
      opacity: 0.5;
    }

    .pos-center { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .pos-right { bottom: 10px; right: 10px; transform: none; left: auto; }

    /* Torna o depurador mais visível em dashboards muito claros */
    #debug-status.escuro {
      background: rgba(0, 0, 0, 0.95) !important;
      opacity: 1.0 !important;
      border: 1px solid rgba(0, 255, 0, 0.5) !important;
    }
  </style>
</head>

<body>

  <div id="splash-screen" onclick="iniciarPainel()">
    <svg viewBox="0 0 260 90" xmlns="http://www.w3.org/2000/svg" style="width:220px; margin-bottom:20px;">
      <!-- Fundo arredondado -->
      <rect x="0" y="0" width="260" height="90" rx="8" fill="#da291c"/>
      <!-- KRAFT -->
      <text x="130" y="38" font-family="'Segoe UI', Arial Black, sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle" letter-spacing="6">KRAFT</text>
      <!-- Linha divisória -->
      <line x1="20" y1="50" x2="240" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
      <!-- HEINZ -->
      <text x="130" y="76" font-family="'Segoe UI', Arial Black, sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle" letter-spacing="6">HEINZ</text>
    </svg>
    <button id="start-btn">INICIAR PAINEL v3.4</button>
    <p style="margin-top: 15px; color: #888;">(Clique para ativar Proteção Total)</p>
  </div>

  <div id="debug-status" class="pos-center">Aguardando Inicialização...</div>
  <div id="motion-dot"></div>

  <div id="container">
    <!-- Painel com animações (rodando no iframe ativo) -->
    <div class="frame ativo" id="frame1">
      <iframe src="https://apps.powerapps.com/play/e/default-3ce34e42-c07d-47bb-b72a-4ce606de6b88/a/2565085e-7689-4bea-ad71-8a089d220c33?tenantId=3ce34e42-c07d-47bb-b72a-4ce606de6b88&hint=876d03ad-c2ca-4368-9e6f-f57f9719e2e7&sourcetime=1754761489227&hidenavbar=true#"></iframe>
    </div>
    <!-- Painel 2 (exibido como imagem estática leve da VM) -->
    <div class="frame" id="frame2">
      <img src="app/painel2.png" style="width: 100vw; height: 100vh; object-fit: fill; background: black;" alt="Painel 2">
    </div>

    <!-- Painel 3 (exibido como imagem estática leve da VM) -->
    <div class="frame" id="frame3">
      <img src="app/painel3.png" style="width: 100vw; height: 100vh; object-fit: fill; background: black;" alt="Painel 3">
    </div>
  </div>

  <script>
    var statusEl = document.getElementById('debug-status');
    var splash = document.getElementById('splash-screen');
    var dot = document.getElementById('motion-dot');
    
    var lastWakeLockStatus = "Aguardando...";
    var lastVideoStatus = "Desativado";
    var lastAudioStatus = "Aguardando...";
    var pulseCount = 0;
    var wakeLock = null;

    function updateDisplay() {
      var now = new Date();
      var timeStr = now.getHours().toString().padStart(2, '0') + ":" + 
                    now.getMinutes().toString().padStart(2, '0') + ":" + 
                    now.getSeconds().toString().padStart(2, '0');
      
      statusEl.innerText = "[" + timeStr + "] Pulse:" + pulseCount + "\nWakeLock:" + lastWakeLockStatus + " | Áudio:" + lastAudioStatus;
    }

    function logStatus(type, msg) {
      if (type === 'wakelock') lastWakeLockStatus = msg;
      if (type === 'audio') lastAudioStatus = msg;
      updateDisplay();
    }

    function iniciarPainel() {
      splash.style.display = 'none';
      
      // 1. Audio Sintetico
      try {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          var audioCtx = new AudioContext();
          var oscillator = audioCtx.createOscillator();
          var gainNode = audioCtx.createGain();
          gainNode.gain.value = 0.001;
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.start();
          logStatus('audio', "Ativo ✅");
        }
      } catch(e) { logStatus('audio', "Erro"); }

      // 3. WakeLock
      if (navigator.wakeLock) {
        navigator.wakeLock.request('screen').then(function(lock) {
          wakeLock = lock;
          logStatus('wakelock', "Ativo ✅");
        }).catch(function() { logStatus('wakelock', "Erro ⚠️"); });
      } else {
        logStatus('wakelock', "Não sup. ❌");
      }

      setTimeout(alternar, 5000);
      setInterval(function() { updateDisplay(); moveDot(); }, 1000);
      setInterval(forceActivity, 30000);
    }

    function moveDot() {
      var x = Math.random() * (window.innerWidth - 10);
      var y = Math.random() * (window.innerHeight - 10);
      dot.style.left = x + "px";
      dot.style.top = y + "px";
    }

    function forceActivity() {
      pulseCount++;
      dot.style.opacity = dot.style.opacity === '0.4' ? '0.39' : '0.4';
      dot.getBoundingClientRect();
      if (navigator.wakeLock && (!wakeLock || wakeLock.released)) {
        navigator.wakeLock.request('screen').then(function(lock) {
          wakeLock = lock;
          logStatus('wakelock', "Reativado ✅");
        }).catch(function() { logStatus('wakelock', "Erro ⚠️"); });
      }
      updateDisplay();
    }

    var frames = [
      { id: "frame1", tempo: 60000, pos: "pos-right" },
      { id: "frame2", tempo: 45000, pos: "pos-center" },
      { id: "frame3", tempo: 30000, pos: "pos-center" }
    ];
    var currentFrameIndex = 0;

    function alternar() {
      var anteriorIndex = currentFrameIndex;
      currentFrameIndex = (currentFrameIndex + 1) % frames.length;
      
      var proximoId = frames[currentFrameIndex].id;
      var proximo = document.getElementById(proximoId);
      
      // Atualiza as imagens adicionando timestamp para evitar que a TV use cache antigo
      if (proximoId === "frame2") {
        var img = proximo.querySelector("img");
        if (img) img.src = "app/painel2.png?t=" + new Date().getTime();
      } else if (proximoId === "frame3") {
        var img = proximo.querySelector("img");
        if (img) img.src = "app/painel3.png?t=" + new Date().getTime();
      }

      if (proximo) proximo.classList.add("ativo");
      
      var atual = document.getElementById(frames[anteriorIndex].id);
      if (atual) atual.classList.remove("ativo");
      
      // Controla dinamicamente a opacidade do depurador de status
      if (proximoId === "frame1" || proximoId === "frame3") {
        statusEl.classList.add("escuro");
      } else {
        statusEl.classList.remove("escuro");
      }
      
      statusEl.className = frames[currentFrameIndex].pos + (statusEl.classList.contains("escuro") ? " escuro" : "");
      setTimeout(alternar, frames[currentFrameIndex].tempo);
    }

    window.onload = function() {
      updateDisplay();
    };

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible' && navigator.wakeLock && (!wakeLock || wakeLock.released)) {
        navigator.wakeLock.request('screen').then(function(lock) {
          wakeLock = lock;
          logStatus('wakelock', "Reativado ✅");
        }).catch(function() { logStatus('wakelock', "Erro ⚠️"); });
      }
    });
  </script>

</body>
</html>
